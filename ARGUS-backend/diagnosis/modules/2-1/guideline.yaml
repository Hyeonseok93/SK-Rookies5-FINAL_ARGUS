# 2-1 (악성코드파일 업로드) 리포트용 대응방안 매핑.
#
# 키는 finding evidence의 `reason` 필드를 ":" 기준으로 나눈 앞부분이다
# (예: "disallowed_extension_accepted:direct_extension" -> "disallowed_extension_accepted").
# `path_exposure`는 evidence.exposure_location/exposed_sample로 판별되는 세부 유형
# (kind)에 따라 detail 섹션에서 한 번 더 갈라진다 — 없으면 default를 쓴다.
#
# 원문 출처: Web/API 개발보안 Guideline v3.0.0 (SK쉴더스, 2022-03-31).

source_document: "Web/API 개발보안 Guideline v3.0.0 (SK쉴더스, 2022-03-31)"

disallowed_extension_accepted:
  guideline_ref: "2-1. 악성코드파일 업로드 (p.61~63)"
  quote: >
    "Application Server에서 실행이 가능한 악성 코드파일의(aspx, asp, php, jsp, html, cgi, perl,
    sh, exe등) 업로드를 차단하기 위해 수용 가능한 파일의 확장자외 모든 파일의 업로드를 금지해야
    하며 Server Side Language(PHP, ASP, JSP 등)에서 제한하도록 설정해야 합니다."
  remediation:
    - "업로드 허용 확장자를 화이트리스트로 제한하고, 그 외 모든 확장자는 서버단(Server Side Language)에서 차단"
    - "확장자 검증은 대소문자 구분 없이 비교하는 함수를 사용"
    - "이중 확장자(예: file.jpg.jsp) 및 확장자 끝에 '.'를 붙이는 등의 trick으로 검사가 우회되지 않도록 처리"
    - "업로드 파일명에 '../', './', '..\\', '.\\', '%', ';' 등 특수문자가 포함된 경우 차단"
    - "업로드 디렉터리는 웹 애플리케이션 하위 폴더가 아닌 별도 폴더/드라이브에 저장하고 실행 권한 제거"
  detail:
    content_type_spoof:
      note: "Content-Type 헤더만으로 파일 종류를 신뢰하지 말고, 서버단에서 확장자/실제 콘텐츠를 함께 검증해야 함"
    magic_byte_polyglot:
      note: "파일 헤더(매직 바이트) 위장만으로 검증을 통과시키지 말고, 확장자 화이트리스트 검사를 병행해야 함"
    double_extension:
      note: "이중 확장자(file.jpg.jsp 등) trick — 가이드라인이 명시적으로 경고하는 우회 기법"
    double_extension_reverse:
      note: "이중 확장자 순서를 반대로 배치하는 변형 — 확장자 파싱 로직이 첫/마지막 토큰 중 하나만 검사할 때 우회됨"
    null_byte:
      note: "널 바이트(%00) 삽입으로 확장자 검사 이후 실제 저장 파일명을 조작하는 시도"
    case_bypass:
      note: "확장자 대소문자를 바꿔 화이트리스트 비교를 우회하는 시도 — 가이드라인이 명시적으로 경고하는 우회 기법"
    trailing_dot:
      note: "확장자 끝에 '.'를 붙이는 trick — 가이드라인이 명시적으로 경고하는 우회 기법"

baseline_upload_rejected:
  # 오탐 후보(false_positive_candidate) — 정상 이미지 baseline 업로드 자체가 거부된 경우.
  # 가이드라인 인용 대상이 아니라, 재진단 전 설정 확인이 필요하다는 안내만 제공한다.
  guideline_ref: null
  note: "baseline(정상 이미지) 업로드 자체가 거부되어 실제 취약 여부를 확정할 수 없습니다. 필드명·인증 토큰·extra_fields 설정을 먼저 확인한 뒤 재진단을 권장합니다."

path_exposure:
  guideline_ref: "2-1. 악성코드파일 업로드 (p.62~63)"
  quote: >
    "웹 서버를 통한 업로드 경로는 웹 애플리케이션 하위 폴더가 아닌 다른 폴더 나 별도의 드라이브 또는
    별도의 물리적 서버에 분리하여 저장하고 외부로부터 업로드 디렉터리에 URL 접근이 불가능 하도록
    해야 합니다."
  remediation:
    - "업로드 성공 응답에 파일의 실제 저장 경로/서버 내부 호스트 정보를 그대로 반환하지 않도록 응답 스키마 최소화"
    - "업로드 파일 접근은 직접 경로가 아닌 별도의 키(랜덤 ID)·인덱싱 값을 통해서만 가능하도록 구현"
  detail:
    internal_host_or_ip:
      guideline_ref: "2-1. 악성코드파일 업로드 (p.62~63) / 5-2. 요청 및 응답 값 내 주요정보 포함여부 확인 (p.105)"
      note: "응답 본문/헤더에 사설 IP 또는 내부 호스트명(localhost, host.docker.internal 등)이 노출됨 — 클라이언트가 알 필요 없는 내부 인프라 정보"
    unix_filesystem_path:
      guideline_ref: "2-1. 악성코드파일 업로드 (p.62~63) / 5-2. 요청 및 응답 값 내 주요정보 포함여부 확인 (p.105)"
      note: "응답에 서버 내부 파일시스템 절대경로(/home, /var, /app 등)가 노출됨"
    windows_filesystem_path:
      guideline_ref: "2-1. 악성코드파일 업로드 (p.62~63) / 5-2. 요청 및 응답 값 내 주요정보 포함여부 확인 (p.105)"
      note: "응답에 서버 내부 Windows 파일시스템 경로가 노출됨"
    public_file_url:
      guideline_ref: "2-1. 악성코드파일 업로드 (p.62~63)"
      note: "업로드된 파일에 직접 접근 가능한 URL이 응답에 그대로 노출됨 — 업로드 디렉터리가 외부에서 URL로 접근 가능한 상태일 가능성"
    storage_object_key:
      guideline_ref: "2-1. 악성코드파일 업로드 (p.62~63)"
      note: "스토리지 객체 키(경로 형태)가 응답에 그대로 노출됨 — 추측 가능한 경로로 직접 접근될 위험"
    stack_trace:
      guideline_ref: "6-1. 오류페이지를 통한 정보 노출 여부 (p.107~109)"
      quote: >
        "민감한 정보를 포함하는 오류 메시지 및 시스템 내부 데이터나 디버깅 정보가 노출되지 않도록 ...
        예외 상황(Exception) 발생시 정보가 화면에 출력되지 않도록 적절한 처리"
      remediation:
        - "업로드 처리 중 발생한 서버 예외(Java stack trace 등)를 응답 바디에 그대로 노출하지 말고, 정형화된 에러 메시지로 대체"
        - "예외 클래스명·내부 패키지 경로가 노출되지 않도록 전역 예외 핸들러(@ControllerAdvice 등) 적용"
