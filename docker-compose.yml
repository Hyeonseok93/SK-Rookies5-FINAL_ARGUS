services:
  zap:
    image: zaproxy/zap-stable
    container_name: argus-zap
    user: zap
    command:
      - zap.sh
      - -daemon
      - -port
      - "8090"
      - -host
      - "0.0.0.0"
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
      - -config
      - api.key=${ZAP_API_KEY:-changeme-zap-key}
    # No host port publish — backend reaches ZAP on the compose network only.
    expose:
      - "8090"
    volumes:
      # Shared swagger / inventory data for ZAP (read-only)
      - ./ARGUS-backend/data:/app/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf \"http://127.0.0.1:8090/JSON/core/view/version/?apikey=${ZAP_API_KEY:-changeme-zap-key}\" || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: unless-stopped

  backend:
    build:
      context: ./ARGUS-backend
    container_name: argus-backend
    ports:
      - "8001:8000"
    environment:
      CONFIG_PATH: /app/config.docker.yaml
      ARGUS_PROBE_HOST: host.docker.internal
      ZAP_PROXY: http://zap:8090
      ZAP_API_KEY: ${ZAP_API_KEY:-changeme-zap-key}
      JWT_SECRET: ${JWT_SECRET:-argus-dev-jwt-secret-change-me}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-argus-dev-credentials-key-change-me}
      ARGUS_ALLOW_PUBLIC_REGISTER: ${ARGUS_ALLOW_PUBLIC_REGISTER:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      # Workspace for ZAP workspace files (MD, swagger.json)
      - ..:/workspace:ro
      # Build / diagnosis outputs (uploads, report, api-tree)
      - ./ARGUS-backend/data:/app/data
      # Live-sync base/login settings into host config files
      - ./ARGUS-backend/config.yaml:/app/config.yaml
      - ./ARGUS-backend/config.docker.yaml:/app/config.docker.yaml
      # Hot-reload FastAPI app code
      - ./ARGUS-backend/app:/app/app
      # Hot-reload diagnosis package (modules, auth_session_pool, etc.)
      - ./ARGUS-backend/diagnosis:/app/diagnosis
      # Hot-reload screenshot code
      - ./ARGUS-backend/screenshot:/app/screenshot
      # Hot-reload report (PDF) code
      - ./ARGUS-backend/report:/app/report
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      zap:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./ARGUS-frontend
    container_name: argus-frontend
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
