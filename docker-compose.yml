services:
  zap:
    image: zaproxy/zap-stable
    container_name: argus-zap
    user: zap
    command:
      - zap.sh
      - -daemon
      - -port
      - "8090"
      - -host
      - "0.0.0.0"
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
      - -config
      - api.disablekey=true
    ports:
      - "8090:8090"
    volumes:
      # backend가 저장한 Swagger 업로드 파일을 같은 절대 경로에서 읽습니다.
      - ./backend/data:/app/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://127.0.0.1:8090/JSON/core/view/version/ || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: argus-backend
    ports:
      - "8001:8000"
    environment:
      CONFIG_PATH: /app/config.docker.yaml
      ARGUS_PROBE_HOST: host.docker.internal
      ZAP_PROXY: http://zap:8090
      GITHUB_TOKEN: ${GITHUB_TOKEN}          
    volumes:
      # Zap 워크스페이스 (MD, swagger.json) — 읽기 전용
      - ..:/workspace:ro
      # 빌드·진단 산출물 유지 (uploads, report, api-tree 등)
      - ./backend/data:/app/data
      # 대시보드에서 저장한 base/login 설정이 호스트 config 파일에 즉시 반영되도록 동기화
      - ./backend/config.yaml:/app/config.yaml
      - ./backend/config.docker.yaml:/app/config.docker.yaml
      # FastAPI 앱 코드도 개발 중에는 호스트와 동기화
      - ./backend/app:/app/app
      # 진단 패키지 전체 → 호스트와 동기화 (modules 외 auth_session_pool 등 포함)
      - ./backend/diagnosis:/app/diagnosis
      # 증거 스크린샷 코드 → 호스트와 동기화
      - ./backend/screenshot:/app/screenshot
      # 결과서(PDF) 생성 코드 → 호스트와 동기화
      - ./backend/report:/app/report
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      zap:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: argus-frontend
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
