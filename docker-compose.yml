services:
  zap:
    image: zaproxy/zap-stable
    container_name: argus-zap
    user: zap
    command:
      - zap.sh
      - -daemon
      - -port
      - "8090"
      - -host
      - "0.0.0.0"
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
      - -config
      - api.disablekey=true
    ports:
      - "8090:8090"
    volumes:
      # backendê°€ ?€?¥í•œ Swagger ?…ë¡œ???Œì¼??ê°™ì? ?ˆë? ê²½ë¡œ?ì„œ ?½ìŠµ?ˆë‹¤.
      - ./ARGUS-backend/data:/app/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://127.0.0.1:8090/JSON/core/view/version/ || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: unless-stopped

  backend:
    build:
      context: ./ARGUS-backend
    container_name: argus-backend
    ports:
      - "8001:8000"
    environment:
      CONFIG_PATH: /app/config.docker.yaml
      ARGUS_PROBE_HOST: host.docker.internal
      ZAP_PROXY: http://zap:8090
      GITHUB_TOKEN: ${GITHUB_TOKEN}          
    volumes:
      # Zap ?Œí¬?¤í˜?´ìŠ¤ (MD, swagger.json) ???½ê¸° ?„ìš©
      - ..:/workspace:ro
      # ë¹Œë“œÂ·ì§„ë‹¨ ?°ì¶œë¬?? ì? (uploads, report, api-tree ??
      - ./ARGUS-backend/data:/app/data
      # ?€?œë³´?œì—???€?¥í•œ base/login ?¤ì •???¸ìŠ¤??config ?Œì¼??ì¦‰ì‹œ ë°˜ì˜?˜ë„ë¡??™ê¸°??
      - ./ARGUS-backend/config.yaml:/app/config.yaml
      - ./ARGUS-backend/config.docker.yaml:/app/config.docker.yaml
      # FastAPI ??ì½”ë“œ??ê°œë°œ ì¤‘ì—???¸ìŠ¤?¸ì? ?™ê¸°??
      - ./ARGUS-backend/app:/app/app
      # ì§„ë‹¨ ?¨í‚¤ì§€ ?„ì²´ ???¸ìŠ¤?¸ì? ?™ê¸°??(modules ??auth_session_pool ???¬í•¨)
      - ./ARGUS-backend/diagnosis:/app/diagnosis
      # ì¦ê±° ?¤í¬ë¦°ìƒ· ì½”ë“œ ???¸ìŠ¤?¸ì? ?™ê¸°??
      - ./ARGUS-backend/screenshot:/app/screenshot
      # ê²°ê³¼??PDF) ?ì„± ì½”ë“œ ???¸ìŠ¤?¸ì? ?™ê¸°??
      - ./ARGUS-backend/report:/app/report
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      zap:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./ARGUS-frontend
    container_name: argus-frontend
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
