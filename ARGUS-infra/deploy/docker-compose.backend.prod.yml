# Synced with repo-root docker-compose.backend.prod.yml for CD/SSM.
# Prefer editing the root file and copying here when both repos diverge.

services:
  zap:
    image: zaproxy/zap-stable
    container_name: argus-zap
    user: zap
    command:
      - zap.sh
      - -daemon
      - -port
      - "8090"
      - -host
      - "0.0.0.0"
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
      - -config
      - api.key=${ZAP_API_KEY}
    # Internal only — do not publish 8090 on the host
    expose:
      - "8090"
    volumes:
      - /opt/argus/data:/app/data:ro
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf \"http://127.0.0.1:8090/JSON/core/view/version/?apikey=$$ZAP_API_KEY\" || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 40s
    environment:
      ZAP_API_KEY: ${ZAP_API_KEY}
    restart: unless-stopped

  backend:
    image: ${ECR_REGISTRY}/argus-${ENVIRONMENT:-dev}-backend:${IMAGE_TAG:-latest}
    container_name: argus-backend
    ports:
      - "8001:8000"
    env_file:
      - /opt/argus/.env
    environment:
      CONFIG_PATH: /app/config.docker.yaml
      ZAP_PROXY: http://zap:8090
      ZAP_API_KEY: ${ZAP_API_KEY}
      ARGUS_ENV: production
      ARGUS_FAIL_CLOSED_SECRETS: "true"
      ARGUS_ALLOW_PUBLIC_REGISTER: ${ARGUS_ALLOW_PUBLIC_REGISTER:-false}
    volumes:
      - /opt/argus/data:/app/data
      - /opt/argus/data/config.yaml:/app/config.yaml
      - /opt/argus/data/config.docker.yaml:/app/config.docker.yaml
    depends_on:
      zap:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
