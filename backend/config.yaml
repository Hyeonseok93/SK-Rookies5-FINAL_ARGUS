app_name: ''
targets:
- name: api
  base_url: http://localhost:8080
- name: admin-api
  base_url: http://localhost:8081
inventory:
  markdown:
    enabled: false
    path: ''
    include_frontend_routes: true
    frontend_base_url: http://localhost:5173
  openapi:
    enabled: false
    path: ''
    base_url: http://localhost:8080
  url_list:
    enabled: false
    path: data/inventory-urls.json
  base_urls:
  - http://localhost:8080
  - http://localhost:8081
  - http://localhost:5173
zap:
  proxy: http://127.0.0.1:8090
  api_key: ''
  auto_wait: true
  wait_seconds: 60
discover:
  openapi_import: true
  seed_requestor: true
  max_seeds: 0
  spider_enabled: true
  spider_max_seconds: 120
  ajax_spider_enabled: true
  ajax_spider_max_seconds: 120
auth:
  id_field: email
  pw_field: password
  token_field: cookie.accessToken
  delivery: cookie
  cookie_name: accessToken
diagnosis_1_3:
  min_score: 2
  max_candidates: 80
  max_mutations_per_param: 5
  httpx_enabled: true
  scan_all_inventory: false
  llm_interpret_enabled: true
  ollama_base_url: http://localhost:11434
  ollama_model: qwen2.5:7b
diagnosis_1_5:
  redirect_sink_base: http://127.0.0.1:8001/argus-redirect-sink
  probe_mode: full
  sample_size: 60
  max_phase_a_jobs: 5000
  max_phase_b_jobs: 10000
  zap_enabled: false
diagnosis_1_6:
  ui_target: http://localhost:5174
  zap_host: 127.0.0.1
  skip_zap: true
  skip_spider: true
  skip_selenium: true
  timeout_sec: 36000
  max_report_findings: 0
diagnosis_4_1:
  probe_mode: sample
  sample_size: 40
  max_endpoints: 80
  timeout: 8.0
  max_pairs_per_endpoint: 12
  cross_cookie_enabled: true
  tamper_enabled: true
  tamper_max_endpoints: 30
  cookie_attr_enabled: true
  cookie_attr_strict: true
  auth_required_only: true
  partial_cross_tamper: true
  max_tamper_variants_per_session: 24
  auth_profiles:
  - bearer
  - cookie_access
  - cookie_refresh
  - dual
  - browser_full
diagnosis_5_2:
  probe_mode: sample
  sample_size: 40
  max_endpoints: 80
  timeout: 12.0
  interval_sec: 0.02
  check_request_url: true
  check_request_body: true
  check_response_body: true
  check_http_plain: true
  enable_auth_modes: true
diagnosis_6_1:
  probe_mode: sample
  sample_size: 40
  max_endpoints: 80
  max_requests: 8000
  timeout: 10.0
  interval_sec: 0.02
  long_lengths:
  - 256
  - 1000
  - 5000
  enable_param_fuzz: true
  enable_body_fuzz: true
  enable_path_fuzz: true
  enable_method_fuzz: true
  enable_header_fuzz: true
  enable_auth_modes: true
  httpx_enabled: true
diagnosis_4_2:
  timeout: 10.0
  max_token_lifetime_minutes: 30
  min_token_length: 32
  min_entropy: 3.5
  probe_path: /api/v1/members/me
  relogin_enabled: true
  duplicate_login_enabled: true
  duplicate_login_ip_enabled: true
  probe_client_ips:
  - 203.0.113.10
  - 198.51.100.20
  logout_enabled: true
  logout_urls: []
  client_logout_enabled: true
  no_server_logout_finding: true
