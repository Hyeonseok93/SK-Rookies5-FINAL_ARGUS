# ────────────────────────────────────────────────────────────────────────────
# docker-compose.backend.prod.yml — Backend EC2 배포용 (CD/SSM 초안)
#
# ec2_backend.tf 주석대로 zap+backend(+추후 worker/selenium)는 이 인스턴스
# "한 대"에서 같이 뜬다 (인스턴스를 분리하지 않기로 결정함, 2026-07-21).
# frontend는 별도 EC2에서 도니 이 파일에 넣지 않는다 — docker-compose.frontend.prod.yml 참고.
#
# docker-compose.yml(로컬 개발용, 소스에서 build)과 분리된 파일이다.
# 여기 있는 backend는 build 대신 CI가 ECR에 push한 이미지를 그대로 pull해서 쓴다.
#
# 실행 전 준비 (CD 배포 스크립트가 해야 하는 것):
#   1. EC2에서 ECR 로그인 (backend EC2 IAM role에 이미 ecr pull 권한 있음 — ecr.tf 참고)
#      aws ecr get-login-password --region ap-northeast-2 \
#        | docker login --username AWS --password-stdin $ECR_REGISTRY
#   2. 아래 환경변수 export (또는 .env 파일로 대체)
#      ECR_REGISTRY=<계정ID>.dkr.ecr.ap-northeast-2.amazonaws.com
#      IMAGE_TAG=latest   # dev 브랜치 push마다 갱신되는 최신 이미지. 롤백 필요해지면
#                         # 특정 커밋 sha 태그로 바꿔서 지정 가능 (build-push 워크플로가 이미 push해둠)
#   3. Secrets Manager 값은 backend가 별도로 /opt/argus/.env로 주입받는다
#      (terraform/scripts/inject-secrets.sh 참고, ec2_backend.tf 부트스트랩이 배치해둠)
#   4. docker compose -f docker-compose.backend.prod.yml pull
#      docker compose -f docker-compose.backend.prod.yml up -d
#
# 잠정 결정 사항 (CI 담당이 결정 — CD 확인 후 이견 있으면 변경 가능):
#   - config.yaml/config.docker.yaml은 대시보드에서 사용자가 base_url/login 설정을
#     저장하면 재배포 후에도 유지돼야 하므로, 이미지에 구워진 버전 대신 EBS 데이터
#     볼륨(/opt/argus/data, ec2_backend.tf에서 실제 마운트 확인됨) 하위에 저장하고
#     bind-mount 한다.
#     주의: bind-mount 대상 파일이 호스트에 없으면 Docker가 빈 디렉터리로 만들어버림.
#     최초 배포 시 CD 스크립트가 backend 레포의 config.yaml/config.docker.yaml을
#     /opt/argus/data/ 밑으로 한 번 복사해둔 뒤 compose up 해야 함 (이후엔 유지됨).
#   - 이미지 태그는 latest 고정 (dev 브랜치 지속 배포 구조이므로 단순화).
#
# TODO(CD/김현석 확인 필요):
#   - worker/selenium 컨테이너는 아직 없음 — 추가되면 이미지 빌드 대상에 포함할지 CI와 협의
# ────────────────────────────────────────────────────────────────────────────

services:
  zap:
    image: zaproxy/zap-stable
    container_name: argus-zap
    user: zap
    command:
      - zap.sh
      - -daemon
      - -port
      - "8090"
      - -host
      - "0.0.0.0"
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
      - -config
      - api.disablekey=true
    ports:
      - "8090:8090"
    volumes:
      - /opt/argus/data:/app/data:ro
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://127.0.0.1:8090/JSON/core/view/version/ || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: unless-stopped

  backend:
    image: ${ECR_REGISTRY}/argus-dev-backend:${IMAGE_TAG:-latest}
    container_name: argus-backend
    # ALB backend 타겟그룹(:8001) → 이 호스트 포트로 전달됨 (terraform alb.tf/variables.tf backend_port 참고)
    ports:
      - "8001:8000"
    env_file:
      - /opt/argus/.env
    environment:
      CONFIG_PATH: /app/config.docker.yaml
      ZAP_PROXY: http://zap:8090
    volumes:
      - /opt/argus/data:/app/data
      - /opt/argus/data/config.yaml:/app/config.yaml
      - /opt/argus/data/config.docker.yaml:/app/config.docker.yaml
    depends_on:
      zap:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
