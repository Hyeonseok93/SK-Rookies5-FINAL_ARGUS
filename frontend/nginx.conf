server {
    listen 80;
    server_name localhost;
    client_max_body_size 50m;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve Docker service names when backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Verify (ZAP discover + spider) can run many minutes; default 60s causes 504.
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
